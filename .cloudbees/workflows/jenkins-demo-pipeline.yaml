apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: jenkins-demo-pipeline

on:
  workflow_dispatch:

jobs:
  run-jenkins-pipeline:
    steps:
      - name: Run Jenkins demo pipeline
        uses: cloudbees-io/jenkins-run-job@v1
        with:
          job-name: demo
          endpoint: local-ci-controller
      
      - name: Publish Jenkins insights
        uses: cloudbees-io/jenkins-publish-insights@v1
        with:
          endpoint: local-ci-controller

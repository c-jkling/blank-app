apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1
      
      - name: SAST Scan
        uses: cloudbees-io/sast-scan@v1
      
      - name: SCA Scan
        uses: cloudbees-io/sca-scan@v1
